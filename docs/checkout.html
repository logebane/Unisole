<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/button_styling.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="icon" type="image/png" href="store_assets/logo_2.png">
    <title>Checkout | UniSole</title>
</head>

<body id="page-top">
    <div class="site-loader" id="site-loader" role="status" aria-label="Loading website">
        <div class="loader-ladder" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <span class="site-loader-label">Loading...</span>
    </div>

    <header>
        <div class="leftSection">
            <a class="logo" href="index.html" aria-label="UniSole home">
                <img src="store_assets/logo_1.png" alt="UniSole">
            </a>
        </div>
        <nav class="middleSection" aria-label="Main navigation">
            <div class="tab"><a href="index.html">Home</a></div>
            <div class="tab"><a href="product_lineup_page.html">Shoes</a></div>
            <div class="tab"><a href="help.html">Inquiries</a></div>
        </nav>
        <div class="rightSection">
            <a class="favorites-link" href="favorites.html" aria-label="Favorites">
                <img src="store_assets/favorite.svg" alt="" aria-hidden="true">
            </a>
            <a class="checkout-link" href="checkout.html" aria-current="page" aria-label="Checkout">
                <img class="checkout-icon" src="store_assets/checkout.png" alt="" aria-hidden="true">
            </a>
            <details class="site-mobile-menu">
                <summary aria-label="Open navigation menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </summary>
                <nav class="site-mobile-menu-links" aria-label="Mobile navigation">
                    <a href="index.html">Home</a>
                    <a href="product_lineup_page.html">Shoes</a>
                    <a href="help.html">Inquiries</a>
                    <a href="favorites.html">Favorites</a>
                    <a href="checkout.html" aria-current="page">Checkout</a>
                </nav>
            </details>
        </div>
    </header>

    <main class="checkout-page">
        <section class="bag-section" aria-labelledby="bag-heading">
            <h1 id="bag-heading">Bag</h1>
            <p id="checkout-empty" class="checkout-empty" hidden>There are no items in your bag.</p>
            <p id="checkout-status" class="checkout-status" role="status" aria-live="polite" hidden></p>
            <div id="bag-items" class="bag-items"></div>
        </section>

        <aside class="summary-section" aria-labelledby="summary-heading">
            <h2 id="summary-heading">Summary</h2>
            <dl class="summary-lines">
                <div>
                    <dt>Subtotal <span class="info-mark"
                            title="Based on the prices listed for items in your bag">?</span></dt>
                    <dd id="bag-subtotal">—</dd>
                </div>
                <div>
                    <dt>Estimated Delivery &amp; Handling</dt>
                    <dd id="bag-delivery">—</dd>
                </div>
                <div class="summary-total">
                    <dt>Total</dt>
                    <dd id="bag-total">—</dd>
                </div>
            </dl>
            <button class="checkout-action" type="button" disabled>Guest Checkout</button>
            <button class="checkout-action" type="button" disabled>Member Checkout</button>
        </aside>
    </main>

    <dialog class="remove-item-dialog" id="remove-item-dialog" aria-labelledby="remove-item-heading"
        aria-describedby="remove-item-message">
        <h2 id="remove-item-heading">Remove item?</h2>
        <p id="remove-item-message">Are you sure you want to remove <span id="remove-item-name"></span> from your bag?
        </p>
        <div class="remove-item-dialog-actions">
            <button class="remove-item-cancel" id="cancel-remove-item" type="button">Keep item</button>
            <button class="remove-item-confirm" id="confirm-remove-item" type="button">Remove item</button>
        </div>
    </dialog>

    <script type="py" src="py_script/loading.py"></script>
    <script type="py" src="py_script/checkout.py"></script>
    <script type="py" src="py_script/scrolling.py"></script>
</body>

</html>
